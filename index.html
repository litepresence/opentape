<!doctype html><html data-theme="dark"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BTCUSD · Opentape</title><link rel="stylesheet" href="styles.css">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('tv-theme')||'dark'}catch(e){}</script>
</head><body>
<header id="topbar"><button id="menu" title="Menu">☰</button><button id="sym">BTCUSD</button><button title="Premium">💎</button><button title="Compare symbols">+</button><button id="tf-btn" title="Timeframe">D</button><button id="ctype" title="Chart type">🕯</button><button id="ind-btn" title="Indicators, metrics, and strategies">Indicators</button><button title="Indicator templates">▦</button><button id="alert-btn" title="Create alert">Alert</button><button id="replay-btn" title="Bar replay">Replay</button><button title="Undo">↩</button><button title="Redo">↪</button><span style="flex:1"></span><button id="theme-btn" title="Theme">🌙</button><button title="Save all charts for all symbols and intervals on your layout">Save ▾</button></header>
<div id="main"><nav id="rail">
<button data-tool="cross" class="active" title="Cross"><svg viewBox="0 0 24 24"><path d="M12 3v4M12 17v4M3 12h4M17 12h4"/><path d="M12 9.5a2.5 2.5 0 100 5 2.5 2.5 0 000-5z"/></svg></button>
<button data-tool="trend" title="Trend line"><svg viewBox="0 0 24 24"><path d="M4 20L20 4"/><circle cx="4" cy="20" r="1.8" class="f"/><circle cx="20" cy="4" r="1.8" class="f"/></svg></button>
<button data-tool="fib" title="Gann and Fibonacci tools"><svg viewBox="0 0 24 24"><path d="M4 5h16M4 10h11M4 15h8M4 20h16"/><circle cx="15" cy="10" r="1.5" class="f"/><circle cx="12" cy="15" r="1.5" class="f"/></svg></button>
<button data-tool="xabcd" title="XABCD pattern"><svg viewBox="0 0 24 24"><path d="M4 18l4-9 4 6 3-4 5 3"/><circle cx="4" cy="18" r="1.6" class="f"/><circle cx="8" cy="9" r="1.6" class="f"/><circle cx="12" cy="15" r="1.6" class="f"/><circle cx="15" cy="11" r="1.6" class="f"/><circle cx="20" cy="14" r="1.6" class="f"/></svg></button>
<button data-tool="prediction" title="Prediction and measurement tools"><svg viewBox="0 0 24 24"><path d="M3 17L14 9"/><path d="M14 9l7-4" stroke-dasharray="3 2"/><circle cx="3" cy="17" r="1.6" class="f"/></svg></button>
<button data-tool="brush" title="Brush"><svg viewBox="0 0 24 24"><path d="M3 18c4 0 4-7 8-7s4 5 9 3"/></svg></button>
<button data-tool="text" title="Text"><svg viewBox="0 0 24 24"><text x="12" y="17" text-anchor="middle" font-size="14" fill="currentColor" stroke="none">T</text></svg></button>
<button data-tool="icon" title="Icons"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M9.5 14.5c.6 1 1.5 1.5 2.5 1.5s2-.5 2.5-1.5"/><circle cx="9.5" cy="10" r=".8" class="f"/><circle cx="14.5" cy="10" r=".8" class="f"/></svg></button>
<button data-tool="shape" title="Geometric shapes"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="1"/></svg></button>
<span class="rail-sep"></span>
<button data-tool="measure" title="Measure"><svg viewBox="0 0 24 24"><path d="M3 15.5L15.5 3 21 8.5 8.5 21z"/><path d="M7 14l1.8 1.8M10 11l1.8 1.8M13 8l1.8 1.8"/></svg></button>
<button data-tool="zoom" title="Zoom in"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M16 16l5 5M11 8.5v5M8.5 11h5"/></svg></button>
<span class="rail-sep"></span>
<button data-tool="magnet" title="Magnet mode snaps drawings placed near price bars to the closest OHLC value"><svg viewBox="0 0 24 24"><path d="M6 3v9a6 6 0 0012 0V3"/><path d="M3 3h6M15 3h6" stroke-width="4"/></svg></button>
<button data-tool="stay" title="Stay in drawing mode"><svg viewBox="0 0 24 24"><path d="M4 20l1-4L16 5l3 3L8 19l-4 1z"/><rect x="15" y="14" width="6" height="6" rx="1"/></svg></button>
<button data-tool="lock" title="Lock all drawings"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="1"/><path d="M8 11V8a4 4 0 018 0v3"/></svg></button>
<button data-tool="hide" title="Hide all drawings"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6z"/><circle cx="12" cy="12" r="2.5"/></svg></button>
<span class="rail-sep"></span>
<button data-tool="del" title="Remove objects"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/><path d="M10 11v6M14 11v6"/></svg></button>
<button data-tool="extra" title="More"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.8" class="f"/><circle cx="12" cy="12" r="1.8" class="f"/><circle cx="19" cy="12" r="1.8" class="f"/></svg></button>
</nav>
